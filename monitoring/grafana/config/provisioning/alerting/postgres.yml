apiVersion: 1

groups:
  - orgId: 1
    name: Postgres
    folder: Default
    interval: 1m
    rules:
      - uid: postgres-down
        title: Postgres Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: pg_up
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: postgres-exporter cannot connect to Postgres

      - uid: postgres-connections-high
        title: Postgres Connections High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: sum by (instance) (pg_stat_activity_count) / max by (instance) (pg_settings_max_connections)
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params:
                      - 0.8
                    type: gt
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Postgres is using {{ humanizePercentage $values.A.Value }} of max_connections

      - uid: postgres-deadlocks
        title: Postgres Deadlocks
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: sum by (datname) (increase(pg_stat_database_deadlocks[10m]))
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: '{{ $values.A.Value }} deadlocks in {{ $labels.datname }} in the last 10 minutes'

      - uid: postgres-long-transaction
        title: Postgres Long Transaction
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: pg_long_running_transactions_oldest_timestamp_seconds
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params:
                      - 3600
                    type: gt
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A Postgres transaction has been open for {{ humanizeDuration $values.A.Value }}
