apiVersion: 1

groups:
  - orgId: 1
    name: General
    folder: Default
    interval: 1m
    rules:
      - uid: bbdb1e61-93c0-4ad1-a100-84059e9e322a
        title: Targets Not Up
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: up
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          description: 'Target {{ $labels.instance }} for job {{ $labels.job }} is down'
          summary: 'Target {{ $labels.instance }} for job {{ $labels.job }} is down'
