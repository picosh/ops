apiVersion: 1

groups:
  - orgId: 1
    name: HTTP
    folder: Default
    interval: 60s
    rules:
      - uid: LKZ1d7bVk
        title: HTTP Redirect
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: probe_success{job=~"blackbox_exporter_http_3xx.*"}
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          severity: warning
        annotations:
          description: HTTP redirect is invalid for {{ $labels.instance }}
          summary: HTTP redirect is invalid for {{ $labels.instance }}
