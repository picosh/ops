apiVersion: 1

groups:
  - orgId: 1
    name: HTTPS
    folder: Default
    interval: 60s
    rules:
      - uid: 7pOZR7x4z
        title: Certificate Expiration
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: floor((probe_ssl_earliest_cert_expiry - time()) / (3600 * 24))
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params:
                      - 20
                    type: lt
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          severity: warning
        annotations:
          description: The certificate for {{ $labels.instance }} will expire in {{ $values.A.Value }} days
          summary: The certificate for {{ $labels.instance }} will expire in {{ $values.A.Value }} days

      - uid: XqLjDnx4k
        title: HTTPS Status
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: probe_success{job=~"blackbox_exporter_https_.*"}
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          description: HTTPS is inaccessible for {{ $labels.instance }}
          summary: HTTPS is inaccessible for {{ $labels.instance }}
