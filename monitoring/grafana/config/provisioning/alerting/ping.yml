apiVersion: 1

groups:
  - orgId: 1
    name: Ping
    folder: Default
    interval: 60s
    rules:
      - uid: ZbqmOnbVz
        title: Ping Status
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: probe_success{job=~"blackbox_exporter_ping.*"}
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        labels:
          severity: warning
        annotations:
          description: Ping is inaccessible for {{ $labels.instance }}
          summary: Ping is inaccessible for {{ $labels.instance }}
