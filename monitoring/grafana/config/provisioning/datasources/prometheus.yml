apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
- name: Prometheus
  type: prometheus
  access: proxy
  orgId: 1
  url: http://prometheus:9090
  isDefault: true
  version: 1
  jsonData:
    # Matches the global scrape interval so $__rate_interval spans enough samples.
    timeInterval: 30s
